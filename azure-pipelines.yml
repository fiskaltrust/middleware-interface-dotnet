resources:
  - repo: self

trigger:
  batch: true
  branches:
    include:
      - master
      - refs/tags/*

pr:
  - master

variables:
  - group: 'Code Signing Certificates'
  - name: BuildConfiguration
    value: release
  - name: BuildPlatform
    value: any cpu
  - name: Solution
    value: 'fiskaltrust.Middleware.Interface.sln'

jobs:
  - job: Build
    pool:
      vmImage: windows-latest
    steps:
      - task: UseDotNet@2
        displayName: "Install .NET 6 SDK"
        inputs:
          packageType: "sdk"
          version: "6.x"

      - task: VisualStudioTestPlatformInstaller@1
        displayName: VsTest Platform Installer

      - task: yavt@1
        inputs:
          mode: 'Multi'
          semverVersion: 'v1'

      - task: DotNetCoreCLI@2
        displayName: Restore
        inputs:
          command: 'restore'
          projects: '**/*.csproj'
          feedsToUse: 'select'
          vstsFeed: 'dev'   # TODO Remove before merge

      - task: DotNetCoreCLI@2
        displayName: Build
        inputs:
          projects: '$(Solution)'
          arguments: '--configuration $(BuildConfiguration)'

      - task: UseDotNet@2
        displayName: "Install .NET 8 SDK for AzureSignTool"
        condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')
        inputs:
          packageType: "sdk"
          version: "8.x"

      - powershell: dotnet tool install --global AzureSignTool --version 7.0.1 --ignore-failed-sources
        displayName: "Install AzureSignTool"
        condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')

      - powershell: |
          Get-ChildItem -Path "$(Build.SourcesDirectory)" -Include fiskaltrust*.dll, fiskaltrust*.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            ForEach-Object {
              azuresigntool sign `
                --azure-key-vault-url "$(AZURE_KEY_VAULT_URL)" `
                --azure-key-vault-certificate "$(AZURE_KEY_VAULT_CERTIFICATE)" `
                --azure-key-vault-client-id "$(AZURE_CLIENT_ID)" `
                --azure-key-vault-tenant-id "$(AZURE_TENANT_ID)" `
                --azure-key-vault-client-secret "$env:AZURE_CLIENT_SECRET" `
                --timestamp-rfc3161 http://timestamp.sectigo.com `
                --timestamp-digest sha256 `
                $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
            }
        displayName: "Code Signing"
        condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')
        env:
          AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)

      - script: dotnet test --no-build --configuration $(buildConfiguration)  --test-adapter-path:. --logger:nunit;LogFilePath=TestResults.xml
        displayName: 'dotnet test ifPOS'
        workingDirectory:  'test\fiskaltrust.ifPOS.Tests'

      - script: dotnet test --no-build --configuration $(buildConfiguration)  --test-adapter-path:. --logger:nunit;LogFilePath=TestResults.xml
        displayName: 'dotnet test Clients'
        workingDirectory:  'test\fiskaltrust.Middleware.Interface.Client.Tests'

      - task: PublishTestResults@2
        displayName: 'Publish Test Results'
        inputs:
          testResultsFormat: NUnit
          testResultsFiles: '**/*TestResults*.xml'
          mergeTestResults: true
          failTaskOnFailedTests: true
          buildConfiguration: $(buildConfiguration)

      - task: DotNetCoreCLI@2
        displayName: dotnet pack
        inputs:
          command: 'pack'
          packagesToPack: 'src/**/*.csproj'
          nobuild: true
          versioningScheme: 'off'

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: drop'
        inputs:
          PathtoPublish: '$(build.artifactstagingdirectory)'